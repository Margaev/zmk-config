manifest:
  remotes:
    - name: custom
      url-base: https://github.com/Margaev
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: custom
      revision: custom-image
      import: app/west.yml
    - name: nice-view-gem
      remote: custom
      revision: main
  self:
    path: config
